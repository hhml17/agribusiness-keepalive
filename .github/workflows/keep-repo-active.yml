name: Keep Repo Active

# GitHub deshabilita los workflows programados tras 60 dias sin actividad
# (commits) en el repo. Este job hace un commit trivial el dia 1 de cada mes
# para que el keep-alive nunca se apague solo.

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Commit timestamp
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-active
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last-active
          git commit -m "chore: keep repo active" || exit 0
          git push
