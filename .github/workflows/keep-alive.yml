name: Keep API Alive

# Render free tier apaga el servidor tras ~15 min sin trafico (cold start ~30-50s).
# Este repo es PUBLICO a proposito: en repos publicos los minutos de GitHub
# Actions son gratis e ilimitados, asi que el doble ping con espera de 6 min
# no consume cuota (en un repo privado este mismo workflow agoto los 2000
# min/mes en agosto 2026 y bloqueo todos los deploys).
#
# GitHub ejecuta los crons con retraso (~25-35 min en la practica aunque se
# pida */10), por eso cada run hace 2 pings separados por 6 minutos.
#
# Los pings nunca hacen fallar el job (|| echo), asi que este workflow no
# genera mails de error aunque la API este caida.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API /ready (doble, con espera)
        run: |
          curl -sf --max-time 90 https://api-livestock.agribusiness.com.py/api/ready \
            && echo "Ping 1: API despierta" \
            || echo "Ping 1 fallo (la API puede estar arrancando)"
          sleep 360
          curl -sf --max-time 90 https://api-livestock.agribusiness.com.py/api/ready \
            && echo "Ping 2: API despierta" \
            || echo "Ping 2 fallo"
